name: Waka Readme

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waka-readme
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate WakaTime stats
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SECTION_NAME: waka
          TOP_N: '20'
          MIN_PERCENT: '0.1'
        run: python .github/scripts/waka_update.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes, nothing to commit"
            exit 0
          fi
          git config user.name "hopelanio123-eng"
          git config user.email "hopelanio123@gmail.com"
          git add README.md
          git commit -m "chore: update wakatime stats"
          git push
